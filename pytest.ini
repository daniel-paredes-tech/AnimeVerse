[pytest]
# Look for tests in tests/, and let them import the animeverse package
# from the project root.
testpaths = tests
pythonpath = .

# Tests marked "live" call the real AniList API. They are skipped by default
# and run only on demand with: pytest -m live
markers =
    live: calls the real AniList API (opt-in, run with -m live)
addopts = -m "not live"
