# The settings shared by every application job (migrate, import).
x-app: &app
  build: .
  image: animeverse:local
  # Only started on request: `docker compose up -d` still starts just the database.
  profiles: ["app"]
  env_file: .env
  environment:
    # Inside Docker the database is the "db" service on its own port, not
    # localhost and the port published on this computer.
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      # Values come from .env. The ":?" makes Docker stop with an error
      # if a value is missing, instead of starting with an empty one.
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      # Bound to 127.0.0.1 so only this computer can connect, not the local network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume: the data survives stopping and removing the container.
      # PostgreSQL 18 images keep their data under /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # pg_isready reports whether PostgreSQL accepts connections.
      # "$$" passes a literal "$" so the variables are read inside the container.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # docker compose run --rm migrate   -> bring the schema up to date
  migrate:
    <<: *app
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy

  # docker compose run --rm import    -> migrate first, then import from AniList
  import:
    <<: *app
    command: ["import"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
