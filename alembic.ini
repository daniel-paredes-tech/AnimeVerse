# Configuration for the `alembic` command (create a migration, see the history...).
# The database connection is NOT here: migrations/env.py reads it from .env.
# To apply migrations, use `animeverse migrate`.

[alembic]
script_location = %(here)s/src/animeverse/infrastructure/postgres/migrations
# Migration files are named 0002_short_description.py; pass --rev-id 0002 to
# `alembic revision` so the numbers stay readable and in order.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
