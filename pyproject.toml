[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "animeverse"
version = "0.2.0"
description = "Imports anime from the AniList API into PostgreSQL."
readme = "README.md"
requires-python = ">=3.11"
# Exact versions, so the project installs the same way on every machine.
dependencies = [
    "httpx==0.28.1",          # HTTP client for the AniList API
    "psycopg[binary]==3.3.9", # PostgreSQL driver; [binary] bundles the client library
    "python-dotenv==1.2.4",   # reads settings from .env
    "alembic==1.20.1",        # numbered, versioned database migrations
    "sqlalchemy==2.1.9",      # required by Alembic; the application itself writes plain SQL
    "fastapi==0.165.0",       # the REST API (ADR 0009); brings Starlette and Pydantic
    "uvicorn==0.54.0",        # the server that runs the API
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",   # linter and formatter
    "mypy==2.4.1",    # type checker: makes the Protocol contracts between layers real
    "import-linter==2.17",  # enforces which layer may import which
    "schemathesis==4.34.2", # tests the API against openapi.yaml (ADR 0010)
]

[project.scripts]
animeverse = "animeverse.entrypoints.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Alembic's template for new migration files
"animeverse.infrastructure.postgres.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked "live" call the real AniList API. They are skipped by default
# and run only on demand with: pytest -m live
markers = ["live: calls the real AniList API (opt-in, run with -m live)"]
addopts = "-m 'not live'"
filterwarnings = [
    # Starlette's TestClient announces a future move from httpx to "httpx2". The
    # tests work with the httpx already pinned for the AniList client; switching
    # would add a second HTTP library. Revisit when Starlette drops httpx.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/W/F: pycodestyle and pyflakes; I: import order; B: likely bugs;
# UP: modern syntax; SIM: simpler code; RUF: ruff's own checks.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true

# Architecture rules, checked by `lint-imports` (and by tests/test_architecture.py).
[tool.importlinter]
root_package = "animeverse"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: dependencies point towards the domain"
type = "layers"
layers = [
    "animeverse.entrypoints",
    "animeverse.infrastructure",
    "animeverse.config",
    "animeverse.application",
    "animeverse.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application never import drivers, HTTP clients or frameworks"
type = "forbidden"
source_modules = ["animeverse.domain", "animeverse.application"]
forbidden_modules = ["psycopg", "httpx", "dotenv", "sqlalchemy", "alembic", "fastapi", "starlette", "pydantic", "uvicorn"]

[[tool.importlinter.contracts]]
name = "Only the entrypoints know the web framework"
type = "forbidden"
source_modules = ["animeverse.infrastructure", "animeverse.config"]
forbidden_modules = ["fastapi", "starlette", "uvicorn"]

[[tool.importlinter.contracts]]
name = "Adapters are independent of each other"
type = "independence"
modules = ["animeverse.infrastructure.anilist", "animeverse.infrastructure.postgres"]
