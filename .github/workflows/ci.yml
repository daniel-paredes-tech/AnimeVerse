# Runs every check on every push and pull request, so nothing broken reaches main.
# Once a week it also runs the live test against the real AniList API, to notice
# if AniList changes its responses.

name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC: the live AniList contract test
  workflow_dispatch:      # run by hand from the Actions tab

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name != 'schedule'
    name: Checks (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version and the one used for development.
        python: ["3.11", "3.14"]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: animeverse
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: animeverse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U animeverse -d animeverse"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: animeverse
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: animeverse

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Types
        run: mypy
      - name: Architecture rules
        run: lint-imports
      - name: Migrations apply to an empty database
        run: animeverse migrate
      - name: Tests
        run: python -m pytest

  # openapi.yaml is the API's contract (ADR 0010): it must lint clean before
  # anything else trusts it. redocly.yaml uses "recommended-strict", so a
  # warning fails too. The Python job above checks the server against it
  # (route parity + Schemathesis, inside pytest).
  contract:
    if: github.event_name != 'schedule'
    name: API contract (Redocly lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"  # the LTS release, as on the development machine
      - name: Lint openapi.yaml
        # Exact version, so the rules can't change under us between runs.
        run: npx --yes @redocly/cli@2.82.0 lint openapi.yaml

  # The web UI (web/) is built only from openapi.yaml. Its API types are
  # generated from the contract and checked in, so a contract change that
  # wasn't regenerated fails here, and the typecheck fails if the UI uses
  # something the contract doesn't define.
  web:
    if: github.event_name != 'schedule'
    name: Web UI (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install (exactly as locked)
        run: npm ci
      - name: API types match openapi.yaml
        run: npm run gen:api && git diff --exit-code -- src/api/schema.d.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  image:
    if: github.event_name != 'schedule'
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t animeverse:ci .
      - name: Smoke test
        run: docker run --rm animeverse:ci --help

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Live AniList contract test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Live test
        run: python -m pytest -m live
