# Runs every check on every push and pull request, so nothing broken reaches main.
# Once a week it also runs the live test against the real AniList API, to notice
# if AniList changes its responses.

name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC: the live AniList contract test
  workflow_dispatch:      # run by hand from the Actions tab

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name != 'schedule'
    name: Checks (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version and the one used for development.
        python: ["3.11", "3.14"]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: animeverse
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: animeverse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U animeverse -d animeverse"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: animeverse
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: animeverse

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Types
        run: mypy
      - name: Architecture rules
        run: lint-imports
      - name: Migrations apply to an empty database
        run: animeverse migrate
      - name: Tests
        run: python -m pytest

  image:
    if: github.event_name != 'schedule'
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t animeverse:ci .
      - name: Smoke test
        run: docker run --rm animeverse:ci --help

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Live AniList contract test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Live test
        run: python -m pytest -m live
